<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Our Watch History">
<meta name="theme-color" content="#f3efe6">
<title>Our Watch History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f3efe6;
  --surface:#ffffff;
  --surface-2:#fbf9f4;
  --ink:#18150f;
  --ink-soft:#6f6a60;
  --line:#18150f;
  --line-soft:#ddd5c2;
  --accent:#cf3f26;
  --accent-ink:#fffaf2;
  --navy:#2c3a58;
  --radius:0px;
  --display:'Fraunces',Georgia,'Iowan Old Style',serif;
  --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,'JetBrains Mono',Menlo,monospace;
}
[data-theme="midnight"]{
  --bg:#14161f;
  --surface:#1c1f2b;
  --surface-2:#232636;
  --ink:#f2efe9;
  --ink-soft:#9a9bb0;
  --line:#3a3f56;
  --line-soft:#2c3143;
  --accent:#e3583f;
  --accent-ink:#14161f;
  --navy:#7c9fd4;
}
[data-theme="noir"]{
  --bg:#0b0b0c;
  --surface:#161616;
  --surface-2:#1e1e1e;
  --ink:#f1ede2;
  --ink-soft:#8c887c;
  --line:#3a3730;
  --line-soft:#2a2823;
  --accent:#d4af37;
  --accent-ink:#0b0b0c;
  --navy:#9aa7c2;
}
[data-theme="sepia"]{
  --bg:#efe3ce;
  --surface:#faf3e6;
  --surface-2:#f3e9d6;
  --ink:#3c2e20;
  --ink-soft:#8a715a;
  --line:#3c2e20;
  --line-soft:#d9c6a5;
  --accent:#a8461f;
  --accent-ink:#faf3e6;
  --navy:#4f5a3a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);height:100%;}
body{padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
::-webkit-scrollbar{display:none;}

/* Masthead */
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top) + 20px) 100px 12px 18px;border-bottom:3px solid var(--ink);}
.topbar h1{font-family:var(--display);font-style:italic;font-weight:700;font-size:32px;margin:0;letter-spacing:-.3px;}
.topbar .sub{font-family:var(--mono);font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:2px;margin-top:4px;}

/* Content area */
.content{flex:1;padding:16px 14px 110px;overflow-y:auto;}
.empty{text-align:center;color:var(--ink-soft);padding:70px 20px;font-size:14px;line-height:1.6;}
.empty b{color:var(--ink);display:block;font-family:var(--display);font-style:italic;font-size:19px;margin-bottom:6px;}

/* Pills / filters */
.pillrow{display:flex;gap:8px;padding:2px 0 14px;overflow-x:auto;align-items:center;}
.sortwrap{margin-left:auto;padding-left:8px;border-left:2px solid var(--line-soft);flex:none;}
.sortwrap select{border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.2px;padding:8px 4px;border-radius:0;max-width:92px;}
.pill{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:9px 14px;border-radius:0;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;}
.pill.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.filterpanel{background:var(--surface);border:2px solid var(--ink);padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;box-shadow:5px 5px 0 var(--line-soft);}
.filterrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filterrow label{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:1.5px;width:100%;}
select,.seg-btn,input[type=text],input[type=number],input[type=date],input[type=time],textarea{
  background:var(--surface-2);border:2px solid var(--ink);color:var(--ink);border-radius:0;padding:10px 11px;font-size:14px;font-family:var(--sans);
}
select{flex:1;min-width:100px;}

/* Editorial grid card */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 14px;}
.section-divider{display:flex;align-items:center;gap:10px;margin:22px 0 14px;}
.section-divider::before,.section-divider::after{content:'';flex:1;height:2px;background:var(--ink);}
.section-divider span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-soft);white-space:nowrap;}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px;}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px;}
.grid.cols-3 .gridcard h3{font-size:12px;}
.grid.cols-4 .gridcard h3{font-size:11px;}
.grid.cols-3 .gridcard .meta,.grid.cols-4 .gridcard .meta{font-size:9px;}
.grid.cols-4 .gridcard .ratings{display:none;}
.grid.cols-3 .gridcard h3,.grid.cols-4 .gridcard h3{overflow-wrap:break-word;}
.grid.cols-3 .gridcard .actions,.grid.cols-4 .gridcard .actions{flex-direction:column;}
.grid.cols-3 .gridcard .actions button,.grid.cols-4 .gridcard .actions button{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 4px !important;font-size:9px !important;}
.grid.cols-3 .gridcard .poster,.grid.cols-4 .gridcard .poster{box-shadow:3px 3px 0 var(--ink);}
.topbar-actions{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:16px;display:flex;align-items:center;gap:8px;}
.gridstepper{display:flex;align-items:center;border:2px solid var(--ink);background:var(--surface);box-shadow:3px 3px 0 var(--line-soft);}
.settingsicon{width:32px;height:32px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:3px 3px 0 var(--line-soft);padding:0;}
.settingsicon svg{width:16px;height:16px;}
.gridstepper button{width:28px;height:28px;border:none;background:none;color:var(--ink);cursor:pointer;font-family:var(--mono);font-size:15px;padding:0;display:flex;align-items:center;justify-content:center;}
.gridstepper button:disabled{opacity:.3;cursor:default;}
.gridstepper button:first-child{border-right:2px solid var(--ink);}
.gridstepper button:last-child{border-left:2px solid var(--ink);}
.gridstepper .count{width:22px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink);}

/* Swipe carousel */
.swipe-wrap{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;padding:6px 30px 22px;margin:0 -14px;}
.swipe-wrap::-webkit-scrollbar{display:none;}
.swipe-card{scroll-snap-align:center;flex:0 0 76%;background:var(--surface);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);}
.swipe-card .poster{width:100%;aspect-ratio:2/3;background:var(--surface-2);overflow:hidden;border-bottom:2px solid var(--ink);}
.swipe-card .poster img{width:100%;height:100%;object-fit:cover;display:block;}
.swipe-card .cap{padding:12px;}
.swipe-card h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 4px;}
.swipe-card .meta{font-family:var(--mono);font-size:10px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:10px;}
.swipe-hint{text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.gridcard{cursor:pointer;position:relative;min-width:0;}
.gridcard.selectable .poster{opacity:.85;}
.gridcard.selected .poster{outline:3px solid var(--accent);outline-offset:2px;}
.selectdot{position:absolute;top:8px;right:8px;width:24px;height:24px;background:var(--surface);border:2px solid var(--ink);color:var(--accent);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:5;}
.selectbar{position:fixed;left:0;right:0;bottom:78px;display:flex;justify-content:center;z-index:25;padding:0 14px;}
.selectbar-inner{max-width:520px;width:100%;background:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--line-soft);display:flex;gap:10px;padding:12px;align-items:center;}
.selectbar-inner span{color:var(--accent-ink);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.5px;flex:1;}
.gridcard .poster{width:100%;aspect-ratio:2/3;background:var(--surface-2);border:2px solid var(--ink);overflow:hidden;position:relative;box-shadow:4px 4px 0 var(--ink);}
.gridcard .poster img{width:100%;height:100%;object-fit:cover;display:block;}
.gridcard .noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:26px;}
.gridcard .cap{padding-top:9px;margin-top:11px;border-top:2px solid var(--ink);}
.gridcard h3{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 3px;line-height:1.22;}
.gridcard h3 em{color:var(--ink-soft);font-style:normal;font-weight:400;}
.gridcard .meta{font-family:var(--mono);font-size:10px;color:var(--ink-soft);letter-spacing:.3px;line-height:1.6;text-transform:uppercase;}
.tag{display:inline-block;}
.tag.hilda{color:var(--navy);}
.tag.mark{color:var(--accent);font-weight:600;}
.ratings{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin-top:5px;text-transform:uppercase;letter-spacing:.3px;}
.ratings b{color:var(--ink);}
.gridcard .actions{display:flex;gap:6px;margin-top:8px;}

/* FAB */
.quickadd{display:flex;gap:8px;margin-bottom:16px;}
.quickadd input{flex:1;}
.btn{background:var(--ink);color:var(--accent-ink);border:2px solid var(--ink);border-radius:0;padding:11px 16px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;font-family:var(--mono);box-shadow:3px 3px 0 var(--line-soft);}
.btn:active{box-shadow:none;transform:translate(3px,3px);}
.btn.secondary{background:var(--surface);color:var(--ink);}
.btn.danger{background:var(--surface);color:var(--accent);border-color:var(--accent);box-shadow:3px 3px 0 rgba(207,63,38,.25);}
.btn.block{width:100%;}
.btn:disabled{opacity:.5;}

/* Bottom nav */
.navbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:3px solid var(--ink);display:flex;justify-content:center;z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.navinner{max-width:520px;width:100%;display:flex;}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 0 10px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;position:relative;border-top:3px solid transparent;margin-top:-3px;}
.navbtn.active{color:var(--ink);border-top-color:var(--accent);}
.navbtn.action{color:var(--accent);}
.navbtn.action svg{width:24px;height:24px;}
.navbtn svg{width:20px;height:20px;}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(24,21,15,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--bg);width:100%;max-width:520px;margin:0 auto;max-height:80vh;overflow-y:auto;padding:22px 18px 26px;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--line-soft);}
.modal h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:24px;margin:0 0 16px;}
.modal-close{position:absolute;top:18px;right:18px;background:var(--ink);border:none;color:var(--accent-ink);width:30px;height:30px;font-size:15px;cursor:pointer;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:1.5px;margin-bottom:6px;}
.field input,.field textarea,.field select{width:100%;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg-btn{cursor:pointer;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.3px;}
.seg-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.searchresults{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.sr-item{display:flex;gap:10px;padding:9px;background:var(--surface);cursor:pointer;border:2px solid var(--ink);}
.sr-item img{width:38px;height:57px;object-fit:cover;background:var(--surface-2);}
.sr-item .t{font-size:13px;font-weight:600;}
.sr-item .y{font-family:var(--mono);font-size:10px;color:var(--ink-soft);text-transform:uppercase;}
.selectedmovie{display:flex;gap:14px;background:var(--surface);border:2px solid var(--ink);padding:12px;margin-top:10px;align-items:center;box-shadow:4px 4px 0 var(--ink);}
.selectedmovie img{width:50px;height:75px;object-fit:cover;border:2px solid var(--ink);}
.dupewarn{background:var(--surface);border:2px solid var(--accent);padding:11px 13px;font-size:12px;color:var(--ink);margin-top:12px;line-height:1.55;}

/* Tag chips */
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface-2);border:2px solid var(--ink);padding:8px;}
.tagchip{display:inline-flex;align-items:center;gap:5px;background:var(--ink);color:var(--accent-ink);padding:5px 8px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
.tagchip button{background:none;border:none;color:var(--accent-ink);cursor:pointer;font-size:14px;line-height:1;padding:0;}
.tagbox input{border:none;background:none;flex:1;min-width:110px;padding:4px 2px;font-size:14px;color:var(--ink);font-family:var(--sans);}
.tagbox input:focus{outline:none;}
.tag-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tag-suggest button{background:var(--surface);border:1px solid var(--line-soft);color:var(--ink-soft);font-family:var(--mono);font-size:11px;padding:5px 9px;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;}

/* Star rating */
.starrating{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.starrow{display:flex;gap:2px;}
.star{position:relative;display:inline-block;width:24px;height:24px;font-size:22px;line-height:24px;text-align:center;cursor:pointer;}
.star-bg{position:absolute;top:0;left:0;color:var(--line-soft);}
.star-fg{position:absolute;top:0;left:0;overflow:hidden;white-space:nowrap;color:var(--accent);}
.starnum{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
.wwrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.wwrow input{flex:1;min-width:120px;}
.ratingsplit{display:flex;gap:10px;align-items:flex-start;}
.ratingsplit .starrating{flex:none;flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:0;}
.ratingsplit textarea{flex:1;min-width:0;}
.dupewarn b{color:var(--accent);}
.row2{display:flex;gap:10px;}
.row2>*{flex:1;}
.toggle-line{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:2px solid var(--ink);padding:11px 13px;margin-bottom:14px;}
.toggle-line span{font-size:13px;font-weight:500;}
.switch{width:38px;height:22px;background:var(--surface);border:2px solid var(--ink);position:relative;cursor:pointer;flex:none;}
.switch.on{background:var(--ink);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--ink);}
.switch.on::after{left:18px;background:var(--accent);}
.hint{font-size:11px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
.settings-section{background:var(--surface);border:2px solid var(--ink);padding:16px;margin-bottom:16px;box-shadow:4px 4px 0 var(--line-soft);}
.settings-section h3{font-family:var(--display);font-style:italic;font-size:16px;margin:0 0 12px;}
.listrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.listrow:last-child{border-bottom:none;}
.iconbtn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:11px;padding:4px 8px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.3px;}
.wl-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;}
.stat-row{display:flex;gap:10px;margin-bottom:16px;}
.stat{flex:1;background:var(--surface);border:2px solid var(--ink);padding:14px 8px;text-align:center;}
.stat b{display:block;font-family:var(--display);font-size:24px;color:var(--accent);}
.stat span{font-family:var(--mono);font-size:9px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.8px;}

/* Theme picker */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.theme-swatch{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--ink);padding:10px;cursor:pointer;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);}
.theme-swatch.active{box-shadow:3px 3px 0 var(--accent);}
.swatch-preview{width:100%;height:36px;display:flex;align-items:flex-end;justify-content:flex-end;gap:4px;padding:6px;border:1px solid var(--line-soft);}
.swatch-preview span{width:12px;height:12px;border-radius:50%;display:block;}

/* Lock screen */
.lockscreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.lockscreen h1{font-family:var(--display);font-style:italic;font-size:34px;margin:0 0 6px;}
.lockscreen .sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:2px;margin-bottom:32px;}
.lockscreen input{width:220px;text-align:center;font-size:20px;letter-spacing:6px;padding:14px;margin-bottom:14px;}
.lockscreen .err{color:var(--accent);font-family:var(--mono);font-size:12px;margin-bottom:10px;min-height:16px;}
</style>

</head>

<script>
/* ---------------- baked-in config ----------------
   Set once so a fresh install/reinstall never needs re-entering. */
const DEFAULT_FIREBASE_CONFIG = {
  "apiKey": "AIzaSyCtIlJhmh5lWRGPkv_Cmw1siE2DOHpqHgI",
  "authDomain": "wewatchedfilmlogger.firebaseapp.com",
  "projectId": "wewatchedfilmlogger",
  "storageBucket": "wewatchedfilmlogger.firebasestorage.app",
  "messagingSenderId": "944650179275",
  "appId": "1:944650179275:web:404c3f4ab5cffb0f23014e"
};
const DEFAULT_TMDB_KEY = '59773d6aa6572f1890714192c9bf85c8';
const APP_PASSCODE_HASHES = [
  'd4458781cf4f969f67ac4a4f2b90c03eb6de87538664d15f7a6e15f3b34e3e24', // 3624
  'bf0a60ee19adc7954e2248d0c4fd7fed44671ea2cff24a6c75127f9ce0183608'  // 1603
];
(function quickTheme(){ try{ const t = localStorage.getItem('reellog:themeCache'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){} })();

/* ---------------- storage helpers ----------------
   Data efficiency: instead of one big shared document (which would resend the
   ENTIRE log on every single save), settings/watchlists live in small
   individual docs, and every movie is its own document in a subcollection —
   adding, editing, or deleting one title only ever transfers that one title,
   not the whole library. Bulk actions (batch import, multi-select delete)
   use a single Firestore batch write instead of one round trip per item. */
let fbDb = null, fbReady = false;
const MOVIES_COLLECTION = 'reellog_movies';
const META_COLLECTION = 'reellog_meta';
const LEGACY_DOC = 'reellog/shared'; // old single-document layout, read once for migration only

function initFirebase(config){
  try{
    if(!firebase.apps.length) firebase.initializeApp(config);
    fbDb = firebase.firestore();
    fbReady = true;
  }catch(e){ console.error('firebase init failed', e); fbReady = false; }
}
(function bootFirebase(){
  let cfg = null;
  try{ const raw = localStorage.getItem('reellog:firebaseConfig'); if(raw) cfg = JSON.parse(raw); }catch(e){}
  initFirebase(cfg || DEFAULT_FIREBASE_CONFIG);
})();

let legacyDocCache; // fetched at most once per session, only if a new-style doc is missing
async function getLegacyField(field){
  if(legacyDocCache===undefined){
    try{ const snap = await fbDb.collection('reellog').doc('shared').get(); legacyDocCache = snap.exists ? snap.data() : null; }
    catch(e){ legacyDocCache = null; }
  }
  return legacyDocCache ? legacyDocCache[field] : undefined;
}

// small settings/watchlists docs
function localGet(key, fallback){
  try{ const raw = localStorage.getItem('reellog:'+key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
async function sGet(key, fallback){
  if(fbReady){
    try{
      const doc = await fbDb.collection(META_COLLECTION).doc(key).get();
      if(doc.exists) return doc.data().value;
      const legacy = await getLegacyField(key);
      if(legacy!==undefined){ fbDb.collection(META_COLLECTION).doc(key).set({value:legacy}); return legacy; }
      return fallback;
    }catch(e){ console.error('firestore get failed — falling back to this device\'s local copy', e); return localGet(key, fallback); }
  }
  return localGet(key, fallback);
}
async function sSet(key, value){
  if(fbReady){
    try{ await fbDb.collection(META_COLLECTION).doc(key).set({value}); return; }
    catch(e){ console.error('firestore set failed', e); }
  }
  try{ localStorage.setItem('reellog:'+key, JSON.stringify(value)); }catch(e){}
}

// movies: one document per title
async function loadMovies(){
  if(fbReady){
    try{
      const snap = await fbDb.collection(MOVIES_COLLECTION).get();
      if(!snap.empty) return snap.docs.map(d=>d.data());
      const legacy = await getLegacyField('movies');
      if(legacy && legacy.length){
        const batch = fbDb.batch();
        legacy.forEach(m=>batch.set(fbDb.collection(MOVIES_COLLECTION).doc(m.id), m));
        await batch.commit();
        return legacy;
      }
      return localGet('movies', []);
    }catch(e){ console.error('firestore movies load failed — falling back to this device\'s local copy', e); return localGet('movies', []); }
  }
  return localGet('movies', []);
}
function persistLocalMovies(){
  try{ localStorage.setItem('reellog:movies', JSON.stringify(state.movies)); }catch(e){}
}
async function saveMovie(movie){
  if(fbReady){
    try{ await fbDb.collection(MOVIES_COLLECTION).doc(movie.id).set(movie); return; }
    catch(e){ console.error('firestore movie save failed', e); }
  }
  persistLocalMovies();
}
async function deleteMovieRemote(id){
  if(fbReady){
    try{ await fbDb.collection(MOVIES_COLLECTION).doc(id).delete(); return; }
    catch(e){ console.error('firestore movie delete failed', e); }
  }
  persistLocalMovies();
}
async function batchSaveMovies(movies){
  if(!movies.length) return;
  if(fbReady){
    try{
      const batch = fbDb.batch();
      movies.forEach(m=>batch.set(fbDb.collection(MOVIES_COLLECTION).doc(m.id), m));
      await batch.commit();
      return;
    }catch(e){ console.error('firestore batch save failed', e); }
  }
  persistLocalMovies();
}
async function batchDeleteMovies(ids){
  if(!ids.length) return;
  if(fbReady){
    try{
      const batch = fbDb.batch();
      ids.forEach(id=>batch.delete(fbDb.collection(MOVIES_COLLECTION).doc(id)));
      await batch.commit();
      return;

}
async function batchPatchMovies(ids, patch){
  if(!ids.length) return;
  if(fbReady){
    try{
      const batch = fbDb.batch();
      ids.forEach(id=>batch.update(fbDb.collection(MOVIES_COLLECTION).doc(id), patch));
      await batch.commit();
      return;
    }catch(e){ console.error('firestore batch update failed', e); }
  }
  persistLocalMovies();
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------------- TMDB ---------------- */
const IMG = 'https://image.tmdb.org/t/p/w342';
async function tmdbSearch(q, mediaType){
  if(!state.settings.tmdbKey) return {error:'nokey'};
  const endpoint = mediaType==='tv' ? 'tv' : 'movie';
  try{
    const res = await fetch(`https://api.themoviedb.org/3/search/${endpoint}?api_key=${state.settings.tmdbKey}&query=${encodeURIComponent(q)}`);
    const d = await res.json();
    if(d.status_code) return {error:'api', message:d.status_message};
    return {results:(d.results||[]).map(r=>normalizeResult(r, endpoint))};
  }catch(e){ return {error:'network'}; }
}
async function tmdbSearchMulti(q){
  if(!state.settings.tmdbKey) return {error:'nokey'};
  try{
    const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${state.settings.tmdbKey}&query=${encodeURIComponent(q)}`);
    const d = await res.json();
    if(d.status_code) return {error:'api', message:d.status_message};
    const results = (d.results||[]).filter(r=>r.media_type==='movie'||r.media_type==='tv').map(r=>normalizeResult(r, r.media_type));
    return {results};
  }catch(e){ return {error:'network'}; }
}
function normalizeResult(r, mediaType){
  return {
    id: r.id, mediaType,
    title: mediaType==='tv' ? r.name : r.title,
    year: (mediaType==='tv' ? r.first_air_date : r.release_date) ? (mediaType==='tv'?r.first_air_date:r.release_date).slice(0,4) : '',
    poster: r.poster_path ? IMG+r.poster_path : '',
    genreIds: r.genre_ids || []
  };
}
async function tmdbGenres(){
  if(!state.settings.tmdbKey) return;
  try{
    const [mRes, tRes] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${state.settings.tmdbKey}`),
      fetch(`https://api.themoviedb.org/3/genre/tv/list?api_key=${state.settings.tmdbKey}`)
    ]);
    const md = await mRes.json(), td = await tRes.json();
    const mMap = {}, tMap = {};
    (md.genres||[]).forEach(g=>mMap[g.id]=g.name);
    (td.genres||[]).forEach(g=>tMap[g.id]=g.name);
    state.settings.genreMapMovie = mMap;
    state.settings.genreMapTv = tMap;
    await sSet('settings', state.settings);
  }catch(e){}
}
function genreNames(ids, mediaType){
  const map = mediaType==='tv' ? state.settings.genreMapTv : state.settings.genreMapMovie;
  return (ids||[]).map(id=>map[id]).filter(Boolean);
}

function normalizeTags(tags){
  if(Array.isArray(tags)) return tags.filter(Boolean);
  if(typeof tags==='string' && tags.trim()) return tags.split(',').map(t=>t.trim()).filter(Boolean);
  return [];
}
function allTags(){
  const set = new Set();
  state.movies.forEach(m=>normalizeTags(m.tags).forEach(t=>set.add(t)));
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function starsHtml(value){
  value = value||0;
  let out = '';
  for(let i=1;i<=5;i++){
    const full = i, half = i-0.5;
    let pct = 0;
    if(value>=full) pct=100; else if(value>=half) pct=50;
    out += `<span class="star" data-star="${i}"><span class="star-bg">★</span><span class="star-fg" style="width:${pct}%">★</span></span>`;
  }
  return out;
}

function posterUrl(url, forceSmall){
  if(!url) return url;
  if(forceSmall) return url.replace('/w342/', '/w92/');
  if(state.settings.lowDataMode) return url.replace('/w342/', '/w154/');
  return url;
}
function applyThemeChrome(theme){
  const dark = theme==='midnight' || theme==='noir';
  const bg = {paper:'#f3efe6', midnight:'#14161f', noir:'#0b0b0c', sepia:'#efe3ce'}[theme] || '#f3efe6';
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  if(themeMeta) themeMeta.setAttribute('content', bg);
  const statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if(statusMeta) statusMeta.setAttribute('content', dark ? 'black-translucent' : 'default');
}

let timeUnit = 'hm'; // hm | days | weeks
function totalWatchTimeLabel(){
  const totalMin = state.movies.filter(m=>m.completed).reduce((sum,m)=>sum+(m.runtimeMinutes||0),0);
  if(totalMin<=0) return '';
  if(timeUnit==='days') return `${(totalMin/1440).toFixed(1)}days watched`;
  if(timeUnit==='weeks') return `${(totalMin/10080).toFixed(1)}weeks watched`;
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return `${h}h ${m}m watched`;
}

async function tmdbRuntime(id, mediaType){
  if(!state.settings.tmdbKey) return 0;
  try{
    const endpoint = mediaType==='tv' ? 'tv' : 'movie';
    const res = await fetch(`https://api.themoviedb.org/3/${endpoint}/${id}?api_key=${state.settings.tmdbKey}`);
    const d = await res.json();
    if(mediaType==='tv'){
      const perEp = (d.episode_run_time && d.episode_run_time[0]) || 0;
      const episodes = d.number_of_episodes || 0;
      return perEp * episodes;
    }
    return d.runtime || 0;
  }catch(e){ return 0; }
}
function togetherName(m){ return m.watchedWithOther || (m.watchedWith==='hilda' ? (state.settings.partnerLabel||'Hilda') : 'Together'); }

function filteredMovies(){
  let list = state.movies.filter(m=>!m.needsReview);
  if(state.typeFilter!=='all') list = list.filter(m=>(m.mediaType||'movie')===state.typeFilter);
  if(state.watchedFilter==='together') list = list.filter(m=>isTogether(m));
  if(state.watchedFilter==='alone') list = list.filter(m=>m.watchedWith==='alone');
  if(state.wf.genre) list = list.filter(m=>(m.genres||[]).includes(state.wf.genre));
  if(state.wf.status==='partial') list = list.filter(m=>!m.completed);
  if(state.wf.status==='complete') list = list.filter(m=>m.completed);
  if(state.wf.fav) list = list.filter(m=>m.favorite);
  if(state.wf.minRating) list = list.filter(m=>{
    const r = Math.max(m.ratingBailey||0, m.ratingHilda||0);
    return r >= Number(state.wf.minRating);
  });
  if(state.wf.location) list = list.filter(m=>m.location===state.wf.location);
  if(state.wf.tag) list = list.filter(m=>normalizeTags(m.tags).includes(state.wf.tag));
  const bestRating = m=>Math.max(m.ratingBailey||0, m.ratingHilda||0);
  if(state.sortBy==='oldest') list.sort((a,b)=>(a.startDate||'9999')<(b.startDate||'9999')?-1:1);
  else if(state.sortBy==='toprated') list.sort((a,b)=>bestRating(b)-bestRating(a));
  else if(state.sortBy==='lowrated') list.sort((a,b)=>bestRating(a)-bestRating(b));
  else if(state.sortBy==='az') list.sort((a,b)=>a.title.localeCompare(b.title));
  else if(state.sortBy==='za') list.sort((a,b)=>b.title.localeCompare(a.title));
  else list.sort((a,b)=>(b.startDate||'0')<(a.startDate||'0')?-1:1);
  return list;
}

function fmtDate(d){ return d ? new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : ''; }

function movieCard(m){
  const withTag = isTogether(m) ? `<span class="tag hilda">${escapeHtml(togetherName(m))}</span>` : m.watchedWith==='alone' ? `<span class="tag">Watched alone</span>` : '';
  let dateStr = m.preLogged ? 'Pre-logged' : '';
  if(!m.preLogged){
    if(m.startDate && m.endDate && m.startDate!==m.endDate) dateStr = `${fmtDate(m.startDate)} → ${fmtDate(m.endDate)}`;
    else if(m.startDate) dateStr = fmtDate(m.startDate);
  }
  let progress = '';
  if(!m.completed && !m.preLogged){
    if(m.mediaType==='tv' && (m.lastSeason||m.lastEpisode)) progress = `<span class="tag mark">Up to S${m.lastSeason||1}E${m.lastEpisode||1}</span>`;
    else if(m.timeStopped) progress = `<span class="tag mark">Stopped at ${escapeHtml(m.timeStopped)}</span>`;
    else progress = `<span class="tag mark">In progress</span>`;
  }
  const marks = [progress, m.isRewatch?'<span class="tag mark">Rewatch</span>':'', m.favorite?'<span class="tag mark">★ Favorite</span>':'', (m.reviewBailey||m.reviewHilda)?'<span class="tag mark">📝 Review</span>':''].filter(Boolean);
  const typeTag = m.mediaType==='tv' ? '<span class="tag">TV</span>' : '';
  const selected = state.selectedIds.has(m.id);
  return `
  <div class="gridcard ${state.selectMode?'selectable':''} ${selected?'selected':''}" data-open="${m.id}">
    ${state.selectMode?`<div class="selectdot">${selected?'✓':''}</div>`:''}
    <div class="poster">${m.poster ? `<img src="${posterUrl(m.poster)}" loading="lazy"/>` : `<div class="noimg">🎬</div>`}</div>
    <div class="cap">
      <h3>${escapeHtml(m.title)} ${m.year?`<em>'${String(m.year).slice(2)}</em>`:''}</h3>
      <div class="meta">${[typeTag,dateStr,withTag].filter(Boolean).join(' · ')}${marks.length?' · '+marks.join(' · '):''}</div>
      ${(m.ratingBailey||m.ratingHilda) ? `<div class="ratings">${m[myRatingKey()]?`You <b>${m[myRatingKey()]}</b>/5`:''}${m[otherRatingKey()]?`${m[myRatingKey()]?' · ':''}${escapeHtml(otherLabel())} <b>${m[otherRatingKey()]}</b>/5`:''}</div>` : ''}
    </div>
  </div>`;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function quickAddToWatchlist(listId){
  const input = document.getElementById('wl-quick');
  const q = input.value.trim();
  if(!q) return;
  if(!state.settings.tmdbKey){ alert('Add your TMDB API key in Settings first so posters can be fetched.'); return; }
  const res = await tmdbSearch(q, wlQuickType);
  if(res.error || !res.results.length){ alert('No matches found — you can still search again or check the title.'); return; }
  const top = res.results[0];
  const list = state.watchlists.find(l=>l.id===listId);
  list.items.push({ id:uid(), tmdbId:top.id, mediaType:wlQuickType, title:top.title, year:top.year, poster:top.poster, genres: genreNames(top.genreIds, wlQuickType), searchedAs:q });
  await sSet('watchlists', state.watchlists);
  input.value='';
  render();
}

async function runBatchImport(){
  const lines = batchState.inputText.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return;
  if(!state.settings.tmdbKey){ alert('Add your TMDB API key in Settings first.'); return; }
  batchState.running = true; batchState.log = []; render();
  const newMovies = [];
  for(const line of lines){
    const yearMatch = line.match(/\((\d{4})\)/);
    const cleanQuery = line.replace(/\(\d{4}\)/,'').trim();
    const res = await tmdbSearchMulti(cleanQuery);
    let pick = null;
    if(!res.error && res.results.length){
      pick = yearMatch ? (res.results.find(r=>r.year===yearMatch[1]) || res.results[0]) : res.results[0];
    }
    if(pick){
      if(batchState.dest==='watchlist'){
        const list = state.watchlists.find(l=>l.id===batchState.listId);
        if(list) list.items.push({ id:uid(), tmdbId:pick.id, mediaType:pick.mediaType, title:pick.title, year:pick.year, poster:pick.poster, genres:genreNames(pick.genreIds,pick.mediaType), needsReview:false, searchedAs:line });
      } else {
        const dupe = state.movies.find(m=>m.tmdbId===pick.id && m.mediaType===pick.mediaType);
        const runtimeMinutes = await tmdbRuntime(pick.id, pick.mediaType);
        const newMovie = {
          id:uid(), tmdbId:pick.id, mediaType:pick.mediaType, title:pick.title, year:pick.year, poster:pick.poster, genres:genreNames(pick.genreIds,pick.mediaType), runtimeMinutes, searchedAs:line,
          preLogged:true, startDate:null, startTime:null, endDate:null, endTime:null,
          watchedWith: batchState.withHilda?'together':'alone', watchedWithOther: batchState.withHilda?(batchState.togetherName||state.settings.partnerLabel):'',
          isRewatch: !!dupe, favorite:false, completed:true, timeStopped:'', sceneNote:'', lastSeason:null, lastEpisode:null,
          tags:'', ratingBailey:null, ratingHilda:null, location:'', locationOther:'', needsReview:false
        };
        state.movies.push(newMovie);
        newMovies.push(newMovie);
      }
      batchState.log.push({line, ok:true, title:pick.title, mediaType:pick.mediaType});
    } else {
      // no match found — add a placeholder to the review queue instead of losing it
      if(batchState.dest==='watchlist'){
        const list = state.watchlists.find(l=>l.id===batchState.listId);
        if(list) list.items.push({ id:uid(), tmdbId:null, mediaType:'movie', title:line, year:'', poster:'', genres:[], needsReview:true, searchedAs:line });
      } else {
        const placeholder = {
          id:uid(), tmdbId:null, mediaType:'movie', title:line, year:'', poster:'', genres:[], runtimeMinutes:0, searchedAs:line,
          preLogged:true, startDate:null, startTime:null, endDate:null, endTime:null,
          watchedWith: batchState.withHilda?'together':'alone', watchedWithOther: batchState.withHilda?(batchState.togetherName||state.settings.partnerLabel):'',
          isRewatch:false, favorite:false, completed:true, timeStopped:'', sceneNote:'', lastSeason:null, lastEpisode:null,
          tags:'', ratingBailey:null, ratingHilda:null, location:'', locationOther:'', needsReview:true
        };
        state.movies.push(placeholder);
        newMovies.push(placeholder);
      }
      batchState.log.push({line, ok:false});
    }
    render();
  }
  await batchSaveMovies(newMovies);
  await sSet('watchlists', state.watchlists);
  batchState.running = false;
  batchState.inputText = '';
  render();
}

function bindFixModal(){
  const fm = state.fixModal;
  const close = ()=>{ state.fixModal=null; render(); };
  document.getElementById('fix-backdrop').onclick = (e)=>{ if(e.target.id==='fix-backdrop') close(); };
  document.getElementById('fix-close').onclick = close;
  document.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{ fm.type=b.dataset.fmt; render(); });
  document.getElementById('fix-correct').onclick = async ()=>{
    const list = state.watchlists.find(l=>l.id===fm.listId);
    const item = list.items.find(i=>i.id===fm.itemId);
    item.needsReview = false;
    await sSet('watchlists', state.watchlists);
    close();
  };
  document.getElementById('fix-delete').onclick = async ()=>{
    if(!confirm('Delete this item?')) return;
    const list = state.watchlists.find(l=>l.id===fm.listId);
    list.items = list.items.filter(i=>i.id!==fm.itemId);
    await sSet('watchlists', state.watchlists);
    close();
  };
  const input = document.getElementById('fix-search');
  let timer;
  input.oninput = ()=>{
    fm.current.searchedAs = input.value;
    clearTimeout(timer);
    const q = input.value.trim();
    if(q.length<2){ document.getElementById('fix-results').innerHTML=''; return; }
    timer = setTimeout(async ()=>{
      const res = await tmdbSearch(q, fm.type);
      const box = document.getElementById('fix-results');
      if(res.error){ box.innerHTML = `<div class="hint">Search failed — check your API key or connection.</div>`; return; }
      box.innerHTML = res.results.slice(0,8).map(r=>`
        <div class="sr-item" data-pick='${r.id}'>
          ${r.poster?`<img src="${posterUrl(r.poster,true)}" loading="lazy"/>`:'<div class="noimg" style="width:38px;height:57px;">🎬</div>'}
          <div><div class="t">${escapeHtml(r.title)}</div><div class="y">${r.year||'—'}</div></div>
        </div>`).join('');
      box.querySelectorAll('[data-pick]').forEach(el=>{
        el.onclick = async ()=>{
          const r = res.results.find(x=>x.id==el.dataset.pick);
          const list = state.watchlists.find(l=>l.id===fm.listId);
          const item = list.items.find(i=>i.id===fm.itemId);
          item.tmdbId=r.id; item.mediaType=fm.type; item.title=r.title; item.year=r.year; item.poster=r.poster; item.genres=genreNames(r.genreIds, fm.type);
          item.needsReview=false; item.searchedAs=q;
          await sSet('watchlists', state.watchlists);
          close();
        };
      });
    }, 400);
  };
  if(input.value.trim().length>=2) input.oninput();
}

      `}

      ${m.selected ? `
      ${!m.editingId && dupe ? `
      <div class="toggle-line">
        <span>Log as rewatch</span>
        <div class="switch on" id="tog-rewatch-locked"></div>
      </div>` : m.editingId ? `
      <div class="toggle-line">
        <span>Mark as rewatch</span>
        <div class="switch ${f.isRewatch?'on':''}" id="tog-rewatch"></div>
      </div>` : ''}

      <div class="toggle-line">
        <span>No date available (pre-logged)</span>
        <div class="switch ${f.preLogged?'on':''}" id="tog-prelogged"></div>
      </div>

      ${!f.preLogged ? `
      <div class="row2">
        <div class="field"><label>Date watched</label><input type="date" id="f-startdate" value="${f.startDate}"/></div>
        <div class="field"><label>Time</label><input type="time" id="f-starttime" value="${f.startTime}"/></div>
      </div>

      <div class="toggle-line">
        <span>${isTv?"Not complete — haven't finished the show":"Not complete — haven't finished it"}</span>
        <div class="switch ${!f.completed?'on':''}" id="tog-notcomplete"></div>
      </div>

      ${f.completed ? `
      <div class="row2">
        <div class="field"><label>Finished</label><input type="date" id="f-enddate" value="${f.endDate||f.startDate}"/></div>
        <div class="field"><label>Time</label><input type="time" id="f-endtime" value="${f.endTime}"/></div>
      </div>` : isTv ? `
      <div class="row2">
        <div class="field"><label>Up to season</label><input type="number" id="f-lastseason" min="1" value="${f.lastSeason}"/></div>
        <div class="field"><label>Episode</label><input type="number" id="f-lastepisode" min="1" value="${f.lastEpisode}"/></div>
      </div>
      <div class="field"><label>Note</label><textarea id="f-scenenote" rows="2" placeholder="Anything worth remembering about where you're up to">${escapeHtml(f.sceneNote)}</textarea></div>
      <div class="hint" style="margin-top:-6px;margin-bottom:14px;">Also kept on your watchlist so it's easy to find and pick back up.</div>
      ` : `
      <div class="field"><label>Time stopped at</label><input type="text" id="f-timestopped" placeholder="e.g. 1:24:00" value="${escapeHtml(f.timeStopped)}"/></div>
      <div class="field"><label>Scene last remembered</label><textarea id="f-scenenote" rows="2" placeholder="What was happening when you stopped?">${escapeHtml(f.sceneNote)}</textarea></div>
      <div class="hint" style="margin-top:-6px;margin-bottom:14px;">Also kept on your watchlist so it's easy to find and pick back up.</div>
      `}
      ` : ''}

      <div class="field">
        <label>Watched with</label>
        <div class="wwrow">
          <div class="seg">
            <button class="seg-btn ${f.watchedWith==='alone'?'active':''}" data-ww="alone">Just me</button>
            <button class="seg-btn ${(f.watchedWith==='together'||f.watchedWith==='hilda'||f.watchedWith==='other')?'active':''}" data-ww="together">Together</button>
          </div>
          ${(f.watchedWith==='together'||f.watchedWith==='hilda'||f.watchedWith==='other')?`<input type="text" id="f-ww-other" placeholder="Who with?" value="${escapeHtml(f.watchedWithOther)}"/>`:''}
        </div>
      </div>

      <div class="field">
        <label>Where</label>
        <div class="seg">
          <button class="seg-btn ${f.location==='Home'?'active':''}" data-loc="Home">Home</button>
          <button class="seg-btn ${f.location==='Cinema'?'active':''}" data-loc="Cinema">Cinema</button>
          ${f.location==='Other' ?
            `<input type="text" id="f-loc-other" class="seg-btn" style="flex:1;min-width:80px;" placeholder="Type where…" value="${escapeHtml(f.locationOther)}" autofocus/>` :
            `<button class="seg-btn" data-loc="Other">Other</button>`}
        </div>
      </div>

      <div class="field">
        <label>Tags <span style="font-size:10px;text-transform:none;color:var(--ink-soft);">(who picked it, occasion, etc.)</span></label>
        <div class="tagbox" id="tagbox">
          ${f.tags.map((t,i)=>`<span class="tagchip">${escapeHtml(t)}<button type="button" data-tagremove="${i}">×</button></span>`).join('')}
          <input type="text" id="f-tag-input" placeholder="${f.tags.length?'Add another…':'e.g. Hilda picked, date night'}"/>
        </div>
        <div class="tag-suggest" id="tag-suggest"></div>
      </div>

      <div class="field">
        <label>Your rating</label>
        <div class="ratingsplit">
          <div class="starrating" data-person="me">
            <div class="starrow">${starsHtml(f[myRatingKey()])}</div>
            <span class="starnum">${f[myRatingKey()]||0}/5</span>
          </div>
          <textarea id="f-review-me" rows="4" placeholder="Your review">${escapeHtml(f[myReviewKey()])}</textarea>
        </div>
      </div>

      <div class="field">
        <label>${escapeHtml(otherLabel())}'s rating</label>
        <div class="ratingsplit">
          <div class="starrating" data-person="other">
            <div class="starrow">${starsHtml(f[otherRatingKey()])}</div>
            <span class="starnum">${f[otherRatingKey()]||0}/5</span>
          </div>
          <textarea id="f-review-other" rows="4" placeholder="${escapeHtml(otherLabel())}'s review">${escapeHtml(f[otherReviewKey()])}</textarea>
        </div>
      </div>

      <div class="field">        <label>Notes</label>
        <textarea id="f-notes" rows="3" placeholder="Anything else worth remembering">${escapeHtml(f.notes)}</textarea>
      </div>

      <div class="toggle-line">
        <span>Mark as favorite</span>
        <div class="switch ${f.favorite?'on':''}" id="tog-fav"></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:6px;">
        ${m.editingId?`<button class="btn danger" id="delete-entry">Delete</button>`:''}
        <button class="btn block" id="save-entry">${m.editingId?'Save changes':'Save to log'}</button>
      </div>
      `:''}
    </div>
  </div>`;
}

function bindModal(){
  const m = state.modal;
  document.getElementById('modal-backdrop').onclick = (e)=>{ if(e.target.id==='modal-backdrop'){ state.modal=null; render(); } };
  document.getElementById('modal-close').onclick = ()=>{ state.modal=null; render(); };
  if(document.getElementById('change-title')) document.getElementById('change-title').onclick = ()=>{ state.modal.selected = null; render(); };

  if(!m.selected){
    document.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{ addModalType=b.dataset.mt; render(); });
    const input = document.getElementById('search-input');
    let timer;
    input.oninput = ()=>{
      state.modal.searchedAs = input.value;
      clearTimeout(timer);
      const q = input.value.trim();
      if(q.length<2){ document.getElementById('search-results').innerHTML=''; return; }
      timer = setTimeout(async ()=>{
        const res = await tmdbSearch(q, addModalType);
        const box = document.getElementById('search-results');
        if(res.error==='nokey'){ box.innerHTML = `<div class="hint">Add your TMDB key in Settings first.</div>`; return; }
        if(res.error){ box.innerHTML = `<div class="hint">Search failed — check your API key or connection.</div>`; return; }
        box.innerHTML = res.results.slice(0,8).map(r=>`
          <div class="sr-item" data-pick='${r.id}'>
            ${r.poster?`<img src="${posterUrl(r.poster,true)}" loading="lazy"/>`:'<div class="noimg" style="width:38px;height:57px;">🎬</div>'}
            <div><div class="t">${escapeHtml(r.title)}</div><div class="y">${r.year||'—'}</div></div>
          </div>`).join('');
        box.querySelectorAll('[data-pick]').forEach(el=>{
          el.onclick = ()=>{
            const r = res.results.find(x=>x.id==el.dataset.pick);
            state.modal.selected = { id:r.id, mediaType:addModalType, title:r.title, year:r.year, poster:r.poster, genres: genreNames(r.genreIds, addModalType) };
            state.modal.searchedAs = q;
            render();
          };
        });
      }, 400);
    };
    if(input.value.trim().length>=2) input.oninput();
    return;
  }

  const f = state.modal.form;
  const q = (id)=>document.getElementById(id);
  // Keep every text/number/date field live-synced to f as the user types,
  // so a re-render triggered by any other control (stars, toggles, etc.)
  // never reverts unsaved typing back to stale data.
  const liveBind = (id, key, parser)=>{
    const el = q(id);
    if(!el) return;
    el.oninput = ()=>{ f[key] = parser ? parser(el.value) : el.value; };
  };
  liveBind('f-startdate','startDate');
  liveBind('f-starttime','startTime');
  liveBind('f-enddate','endDate');
  liveBind('f-endtime','endTime');
  liveBind('f-ww-other','watchedWithOther');
  liveBind('f-loc-other','locationOther');
  liveBind('f-timestopped','timeStopped');
  liveBind('f-scenenote','sceneNote');
  liveBind('f-lastseason','lastSeason', v=>v?Number(v):null);
  liveBind('f-lastepisode','lastEpisode', v=>v?Number(v):null);
  liveBind('f-review-me', myReviewKey());
  liveBind('f-review-other', otherReviewKey());
  liveBind('f-notes','notes');
  if(q('tog-prelogged')) q('tog-prelogged').onclick=()=>{ f.preLogged=!f.preLogged; render(); };
  if(q('tog-notcomplete')) q('tog-notcomplete').onclick=()=>{ f.completed=!f.completed; render(); };
  if(q('tog-fav')) q('tog-fav').onclick=()=>{ f.favorite=!f.favorite; render(); };
  if(q('tog-rewatch')) q('tog-rewatch').onclick=()=>{ f.isRewatch=!f.isRewatch; render(); };
  document.querySelectorAll('[data-ww]').forEach(b=>b.onclick=()=>{
    f.watchedWith=b.dataset.ww;
    if(b.dataset.ww==='together' && !f.watchedWithOther) f.watchedWithOther = state.settings.partnerLabel;
    render();
  });
  document.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{ f.location = f.location===b.dataset.loc? '' : b.dataset.loc; render(); });

  // tag chips
  if(q('tagbox')){
    const tagInput = q('f-tag-input');
    q('tagbox').querySelectorAll('[data-tagremove]').forEach(b=>b.onclick=()=>{
      f.tags.splice(Number(b.dataset.tagremove), 1);
      render();
    });
    const commitTag = (val)=>{
      val = val.trim().replace(/,$/,'').trim();
      if(val && !f.tags.includes(val)) f.tags.push(val);
      tagInput.value='';
      render();
    };
    tagInput.oninput = ()=>{
      const val = tagInput.value.trim();
      const box = q('tag-suggest');
      if(val.includes(',')){ commitTag(val); return; }
      if(!val){ box.innerHTML=''; return; }
      const matches = allTags().filter(t=>t.toLowerCase().includes(val.toLowerCase()) && !f.tags.includes(t)).slice(0,6);
      box.innerHTML = matches.map(t=>`<button type="button" data-tagpick="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('');
      box.querySelectorAll('[data-tagpick]').forEach(b=>b.onclick=()=>commitTag(b.dataset.tagpick));
    };
    tagInput.onkeydown = (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); if(tagInput.value.trim()) commitTag(tagInput.value); }
      if(e.key==='Backspace' && !tagInput.value && f.tags.length){ f.tags.pop(); render(); }
    };
  }

  // star ratings
  document.querySelectorAll('.starrating').forEach(container=>{
    const person = container.dataset.person;
    const key = person==='me' ? myRatingKey() : otherRatingKey();
    container.querySelectorAll('.star').forEach(starEl=>{
      starEl.onclick = (e)=>{
        const rect = starEl.getBoundingClientRect();
        const isLeftHalf = (e.clientX - rect.left) < rect.width/2;
        const i = Number(starEl.dataset.star);
        const value = isLeftHalf ? i-0.5 : i;
        f[key] = (f[key]===value ? 0 : value);
        render();
      };
    });
  });

  if(q('save-entry')) q('save-entry').onclick = async ()=>{
    if(q('f-startdate')) f.startDate = q('f-startdate').value;
    if(q('f-starttime')) f.startTime = q('f-starttime').value;
    if(q('f-enddate')) f.endDate = q('f-enddate').value;
    if(q('f-endtime')) f.endTime = q('f-endtime').value;
    if(q('f-ww-other')) f.watchedWithOther = q('f-ww-other').value;
    if(q('f-loc-other')) f.locationOther = q('f-loc-other').value;
    if(q('f-notes')) f.notes = q('f-notes').value;
    if(q('f-timestopped')) f.timeStopped = q('f-timestopped').value;
    if(q('f-scenenote')) f.sceneNote = q('f-scenenote').value;
    if(q('f-lastseason')) f.lastSeason = q('f-lastseason').value ? Number(q('f-lastseason').value) : null;
    if(q('f-lastepisode')) f.lastEpisode = q('f-lastepisode').value ? Number(q('f-lastepisode').value) : null;
    if(q('f-review-me')) f[myReviewKey()] = q('f-review-me').value;
    if(q('f-review-other')) f[otherReviewKey()] = q('f-review-other').value;

    const dupe = state.movies.find(mv=>mv.tmdbId===state.modal.selected.id && mv.mediaType===state.modal.selected.mediaType && mv.id!==state.modal.editingId);
    const isRewatch = q('tog-rewatch-locked') ? true : f.isRewatch;
    const completed = f.preLogged ? true : f.completed;

    if(state.modal.selected.runtimeMinutes===undefined){
      state.modal.selected.runtimeMinutes = await tmdbRuntime(state.modal.selected.id, state.modal.selected.mediaType);
    }

    const entry = {
      id: state.modal.editingId || uid(),
      tmdbId: state.modal.selected.id,
      mediaType: state.modal.selected.mediaType,
      title: state.modal.selected.title,
      year: state.modal.selected.year,
      poster: state.modal.selected.poster,
      genres: state.modal.selected.genres,
      runtimeMinutes: state.modal.selected.runtimeMinutes || 0,
      searchedAs: state.modal.searchedAs || '',
      preLogged: f.preLogged,
      startDate: f.preLogged ? null : f.startDate,
      startTime: f.preLogged ? null : f.startTime,
      endDate: f.preLogged ? null : (completed ? (f.endDate || f.startDate) : null),
      endTime: f.preLogged ? null : (completed ? f.endTime : null),
      watchedWith: f.watchedWith, watchedWithOther: f.watchedWithOther,
      location: f.location, locationOther: f.locationOther,
      favorite: f.favorite, tags: f.tags,
      completed: completed,
      timeStopped: completed ? '' : f.timeStopped,
      sceneNote: completed ? '' : f.sceneNote,
      lastSeason: completed ? null : f.lastSeason,
      lastEpisode: completed ? null : f.lastEpisode,
      ratingBailey: f.ratingBailey, ratingHilda: f.ratingHilda,
      reviewBailey: f.reviewBailey, reviewHilda: f.reviewHilda,
      notes: f.notes,
      isRewatch: !!(isRewatch || (dupe && !state.modal.editingId)),
      needsReview: false
    };

    if(state.modal.editingId){
      const idx = state.movies.findIndex(mv=>mv.id===state.modal.editingId);
      state.movies[idx] = entry;
    } else {
      state.movies.push(entry);
    }
    await saveMovie(entry);

    if(state.modal.fromWatchlistId){
      const list = state.watchlists.find(l=>l.id===state.modal.fromWatchlistId);
      list.items = list.items.filter(i=>i.id!==state.modal.fromWatchlistItemId);
      await sSet('watchlists', state.watchlists);
    }

    if(!completed){
      const alreadyOnList = state.watchlists.some(l=>l.items.some(i=>i.tmdbId===entry.tmdbId && i.mediaType===entry.mediaType));
      if(!alreadyOnList){
        const targetList = state.watchlists.find(l=>l.id===state.wlActive) || state.watchlists[0];
        if(targetList){
          targetList.items.push({ id:uid(), tmdbId:entry.tmdbId, mediaType:entry.mediaType, title:entry.title, year:entry.year, poster:entry.poster, genres:entry.genres, needsReview:false, searchedAs:entry.searchedAs });
          await sSet('watchlists', state.watchlists);
        }
      }
    }

    const returnTab = state.modal.returnTab || 'watched';
    state.modal = null;
    state.tab = returnTab;
    render();
  };

  if(q('delete-entry')) q('delete-entry').onclick = async ()=>{
    if(!confirm('Delete this entry for good?')) return;
    const id = state.modal.editingId;
    state.movies = state.movies.filter(mv=>mv.id!==id);
    await deleteMovieRemote(id);
    state.modal = null; render();
  };
}

/* ---------------- init ---------------- */
loadAll();
</script>
